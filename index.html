<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гидрант</title>

  <link rel="icon" type="image/png" href="icon.png">

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ===== АНИМИРОВАННЫЙ ФОН ===== */
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        60deg,
        #0b0d12,
        #2a1360,
        #1a1f4b,
        #0b0d12
      );
      background-size: 600% 600%;
      animation: gradientFlow 12s linear infinite;
      display: flex;
      justify-content: center;
      color: #ffffff;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== ПЛАВАЮЩИЕ УЗОРЫ ===== */
    .background-shapes {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }

    .shape {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(138,43,226,0.45), transparent 70%);
      filter: blur(60px);
      animation: float 20s ease-in-out infinite;
    }

    .shape:nth-child(1) {
      top: 10%;
      left: -10%;
    }

    .shape:nth-child(2) {
      top: 50%;
      right: -15%;
      animation-delay: -7s;
    }

    .shape:nth-child(3) {
      bottom: -10%;
      left: 30%;
      animation-delay: -14s;
    }

    @keyframes float {
      0% { transform: translate(0, 0); }
      50% { transform: translate(40px, -60px); }
      100% { transform: translate(0, 0); }
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 40px 20px;
      text-align: center;
    }

    /* ===== АНИМАЦИЯ ПОЯВЛЕНИЯ ===== */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade {
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }

    /* ===== КОНТЕНТ ===== */
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.15);
      margin-bottom: 20px;
      background: #111;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
    }

    .username {
      margin-top: 6px;
      font-size: 16px;
      color: #b3b3ff;
    }

    /* ===== ОБНОВЛЕННЫЙ БЛОК ABOUT ME ===== */
    .about {
      margin-top: 24px;
      padding: 20px;
      background: rgba(25, 22, 45, 0.85);
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      border: 2px solid transparent;
      text-align: left;
      backdrop-filter: blur(8px);
      position: relative;
      color: #e0e0ff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .about::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 18px;
      background: rgba(138, 43, 226, 0.6); /* однотонная фиолетовая рамка */
      z-index: -1;
      filter: blur(12px);
      opacity: 0.7;
    }

    .about b {
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .about:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    /* ===== Стили для списка внутри About ===== */
    .about ul {
      margin: 0;
      padding-left: 20px;
      list-style: disc;
    }

    .about ul li {
      margin-bottom: 8px;
    }

    .buttons {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      text-decoration: none;
      padding: 16px;
      border-radius: 16px;
      background: rgba(25, 22, 45, 0.8);
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.12);
      transition: transform 0.12s ease, background 0.12s ease;
      backdrop-filter: blur(6px);
    }

    .btn:active {
      transform: scale(0.97);
      background: rgba(40, 35, 70, 0.9);
    }
  </style>
</head>
<body>
<div class="background-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<div class="container">

  <img src="avatar.png" alt="Avatar" class="avatar fade delay-1">

  <h1 class="fade delay-2">Гидрант</h1>
  <div class="username fade delay-2">@qufxp</div>

  <div class="about fade delay-3">
    <b>About me</b><br><br>
    <ul>
      <li><b>6+ лет</b> активного присутствия в <b>Telegram</b></li>
      <li>Ранее активно работал в <b>Discord</b></li>
      <li>Опыт работы с <b>NFT</b> и цифровыми проектами</li>
      <li>Сейчас изучаю <b>программирование</b> и развиваюсь в <b>IT</b></li>
    </ul>
  </div>

  <div class="buttons fade delay-4">
    <a class="btn" href="https://t.me/qufxp" target="_blank">My Telegram</a>
    <a class="btn" href="https://t.me/qufxpforever" target="_blank">My channel</a>
    <a class="btn" href="https://t.me/ignorantchat" target="_blank">My chat</a>
  </div>

</div>

</body>
</html>
