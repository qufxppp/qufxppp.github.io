<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Гидрант</title>

  <link rel="icon" type="image/png" href="icon.png">

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ===== АНИМИРОВАННЫЙ ФОН ===== */
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        60deg,
        #0b0d12,
        #2a1360,
        #1a1f4b,
        #0b0d12
      );
      background-size: 600% 600%;
      animation: gradientFlow 12s linear infinite;
      display: flex;
      justify-content: center;
      color: #ffffff;
      line-height: 1.5;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== ПЛАВАЮЩИЕ УЗОРЫ ===== */
    .background-shapes {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }

    .shape {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(138,43,226,0.45), transparent 70%);
      filter: blur(60px);
      animation: float 20s ease-in-out infinite, pulse 6s ease-in-out infinite;
      opacity: 0.8;
    }

    .shape:nth-child(1) {
      top: 10%;
      left: -10%;
    }

    .shape:nth-child(2) {
      top: 50%;
      right: -15%;
      animation-delay: -7s;
    }

    .shape:nth-child(3) {
      bottom: -10%;
      left: 30%;
      animation-delay: -14s;
    }

    @keyframes float {
      0% { transform: translate(0, 0); }
      50% { transform: translate(40px, -60px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.9; }
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 40px 20px;
      text-align: center;
    }

    /* ===== АНИМАЦИЯ ПОЯВЛЕНИЯ ===== */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade {
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }

    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }

    /* ===== КОНТЕНТ ===== */
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.15);
      margin-bottom: 20px;
      background: #111;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .avatar:hover {
      transform: scale(1.05) rotate(-1deg);
      box-shadow: 0 12px 30px rgba(138,43,226,0.4);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 600;
      position: relative;
    }

    h1::after {
      content: "";
      display: block;
      width: 60px;
      height: 2px;
      margin: 10px auto 0;
      background: linear-gradient(90deg, transparent, #8a2be2, transparent);
    }

    .username {
      margin-top: 6px;
      font-size: 16px;
      color: #b3b3ff;
    }

    /* ===== ABOUT ===== */
    .about {
      margin-top: 24px;
      padding: 20px;
      background: rgba(25, 22, 45, 0.85);
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      border: 2px solid transparent;
      text-align: left;
      backdrop-filter: blur(8px);
      position: relative;
      color: #e0e0ff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
    }

    .about::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      border-radius: 18px;
      background: rgba(138, 43, 226, 0.6);
      z-index: -1;
      filter: blur(12px);
      opacity: 0.7;
    }

    .about b {
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .about:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .about ul {
      margin: 0;
      padding-left: 20px;
    }

    .about ul li {
      margin-bottom: 8px;
    }

    /* ===== КНОПКИ ===== */
    .buttons {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #7a3cff, #b36bff);
      color: #ffffff;
      font-weight: 500;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(138,43,226,0.45);
    }

    /* ===== ACCESSIBILITY ===== */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="background-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <main class="container">
    <img src="avatar.png" alt="Avatar" class="avatar fade delay-1">

    <h1 class="fade delay-2">Гидрант</h1>
    <div class="username fade delay-3">@hydrant</div>

    <section class="about fade delay-4">
      <b>Обо мне</b>
      <ul>
        <li>Frontend / UI энтузиаст</li>
        <li>Люблю анимации и чистый код</li>
        <li>Делаю красиво и аккуратно</li>
      </ul>
    </section>

    <div class="buttons fade delay-4">
      <a href="#" class="btn">Telegram</a>
      <a href="#" class="btn">GitHub</a>
      <a href="#" class="btn">Discord</a>
    </div>
  </main>
</body>
</html>
